{% extends "base.html" %}
{% block title %}Forgot Password - Warranty Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title mb-4">Forgot Password</h3>
        <p>Enter your email address and we'll send a reset code.</p>

        <form method="post" action="{{ url_for('auth.forgot_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="identifier" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="identifier" name="identifier" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Send Reset Code</button>
        </form>

        <hr>
        <p class="text-center mb-0">
          <a href="{{ url_for('auth.login') }}">Back to login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
