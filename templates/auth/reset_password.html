{% extends "base.html" %}
{% block title %}Reset Password - Warranty Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title mb-4">Reset Password</h3>

        <form method="post" action="{{ url_for('auth.reset_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="user_id" value="{{ user_id }}">

          <div class="mb-3">
            <label for="code" class="form-label">Reset Code</label>
            <input type="text" class="form-control text-center" id="code" name="code"
                   required maxlength="6" pattern="\d{6}" placeholder="000000">
          </div>

          <div class="mb-3">
            <label for="new_password" class="form-label">New Password</label>
            <input type="password" class="form-control" id="new_password" name="new_password" required minlength="8">
          </div>

          <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Reset Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
