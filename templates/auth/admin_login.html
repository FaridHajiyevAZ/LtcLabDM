{% extends "base.html" %}
{% block title %}Admin Login - Warranty Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-dark">
      <div class="card-body p-4">
        <h3 class="card-title mb-4"><i class="bi bi-shield-lock"></i> Admin Login</h3>
        <form method="post" action="{{ url_for('auth.admin_login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="identifier" class="form-label">Admin Email</label>
            <input type="email" class="form-control" id="identifier" name="identifier" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>

          <button type="submit" class="btn btn-dark w-100">Admin Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
