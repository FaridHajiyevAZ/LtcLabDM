{% extends "base.html" %}
{% block title %}Login - Warranty Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title mb-4">Log In</h3>
        <form method="post" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="identifier" class="form-label">Email or Phone Number</label>
            <input type="text" class="form-control" id="identifier" name="identifier" required
                   value="{{ request.form.get('identifier', '') }}"
                   placeholder="your@email.com or +1234567890">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>

        <div class="mt-3 text-center">
          <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
        </div>

        <hr>
        <p class="text-center mb-0">
          Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
