{% extends "base.html" %}
{% block title %}Profile - Warranty Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title mb-4">My Profile</h3>

        <form method="post" action="{{ url_for('customer.profile') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name"
                   value="{{ user.full_name }}" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ user.email or '' }}" readonly>
            <div class="form-text">Email cannot be changed after registration.</div>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" name="phone"
                   value="{{ user.phone or '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Account Created</label>
            <input type="text" class="form-control" value="{{ user.created_at.strftime('%Y-%m-%d') }}" readonly>
          </div>

          <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
